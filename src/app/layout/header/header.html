<header class="header">
  <div class="header__inner">
    <a
      class="header__brand"
      routerLink="/"
      i18n-aria-label="@@header.brand.label"
      aria-label="Solventa, ir al inicio"
    >
      Solventa
    </a>

    <div class="header__end">
      <nav
        class="header__nav"
        i18n-aria-label="@@header.nav.label"
        aria-label="Navegación principal"
      >
        <ul class="header__list">
          @for (item of navItems(); track item.path) {
            <li>
              <a
                class="header__link"
                [routerLink]="item.path"
                routerLinkActive="header__link--active"
                [routerLinkActiveOptions]="{ exact: item.exact }"
                ariaCurrentWhenActive="page"
              >
                <span aria-hidden="true">{{ item.icon }}</span>
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </nav>

      <div class="header__session">
        @if (session.user(); as user) {
          <span class="header__user">{{ user.name }}</span>
          <button type="button" class="header__link header__button" (click)="logout()">
            <ng-container i18n="@@header.logout">Cerrar sesión</ng-container>
          </button>
        } @else {
          <a class="header__link" routerLink="/login" i18n="@@header.login">Ingresar</a>
        }
      </div>

      <sol-language-selector />
    </div>
  </div>
</header>
